# /etc/systemd/system/getty@tty1.service.d/zz-ps5lm-ai.conf
# In AI mode (ps5lm.ai=1) the tty1 autologin never starts, so the gaming session (gamescope + Steam, ~1.1 GB)
# never comes up and cannot respawn behind ps5lm-min. Game mode (no flag) is unchanged. The serial getty
# (rescue console, ttyTitania0) is a different unit and always runs.
[Unit]
ConditionKernelCommandLine=!ps5lm.ai=1
